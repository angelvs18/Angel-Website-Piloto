<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b1a">
    <meta name="robots" content="noindex">
    <title>Página no encontrada · Angel Méndez Aguilar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #eef2ff;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            background:
                radial-gradient(40rem 32rem at 12% 8%, rgba(56, 89, 160, 0.30), transparent 70%),
                radial-gradient(36rem 30rem at 92% 30%, rgba(60, 110, 140, 0.18), transparent 70%),
                radial-gradient(44rem 36rem at 60% 100%, rgba(52, 96, 120, 0.14), transparent 70%),
                #070b1a;
        }
        main {
            width: min(100%, 34rem);
            padding: 48px 32px;
            border-radius: 24px;
            text-align: center;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 10px 30px rgba(0, 0, 0, 0.25);
            -webkit-backdrop-filter: blur(16px) saturate(115%);
            backdrop-filter: blur(16px) saturate(115%);
        }
        h1 { font-size: clamp(2rem, 6vw, 2.75rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
        p { margin-top: 12px; color: #a8b3cf; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 52px;
            margin-top: 28px;
            padding: 0 28px;
            border-radius: 999px;
            background: #3b6fd4;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        a:active { transform: scale(0.97); }
        a:focus-visible { outline: 2px solid #8fb0e8; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>Página no encontrada</h1>
        <p>La dirección que buscas no existe o cambió de lugar.</p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
